name: Generate VOICEVOX short

on:
  workflow_dispatch:
    inputs:
      speaker:
        description: "VOICEVOX speaker ID (3 = Zundamon normal)"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow
      - name: Start VOICEVOX Engine (CPU)
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
      - name: Generate narrated vertical MP4
        env:
          VOICEVOX_SPEAKER: ${{ inputs.speaker }}
        run: python scripts/generate.py
      - name: Upload preview (not published)
        uses: actions/upload-artifact@v4
        with:
          name: lateral-short-preview
          path: output/lateral-short.mp4
          retention-days: 7
          if-no-files-found: error
